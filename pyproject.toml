[project]
name = "rag"
version = "0.1.0"
description = "多模态 RAG 系统：PaddleOCR-VL + Qwen Embedding + ChromaDB"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "loguru>=0.7.3",
    "openai>=3.3.1",
    "paddleocr>=3.7.0",
    "pillow>=12.3.0",
    "pydantic-settings>=2.3.0",
    "python-multipart>=0.0.9",
    "pypdf>=6.16.1",
    "tiktoken>=0.8.0",
]

[project.scripts]
rag-api = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["src/dots-ocr"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
